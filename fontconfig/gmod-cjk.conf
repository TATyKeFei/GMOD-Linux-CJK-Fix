      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>WenQuanYi Micro Hei</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- CEF / HTML 菜单可能用通用字体族 -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>sans</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- 等宽字体：控制台、聊天等 -->
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono CJK TC</string>
      <string>WenQuanYi Micro Hei Mono</string>
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono CJK TC</string>
      <string>WenQuanYi Micro Hei Mono</string>
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>PT Mono</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono CJK TC</string>
      <string>WenQuanYi Micro Hei Mono</string>
      <string>monospace</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Courier New</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Sans Mono CJK TC</string>
      <string>WenQuanYi Micro Hei Mono</string>
