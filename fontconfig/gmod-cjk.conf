<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Garry's Mod (Linux 原生版) 中文字体修复
    安装：保存到 ~/.config/fontconfig/gmod-cjk.conf
    Steam 启动项：FONTCONFIG_FILE=~/.config/fontconfig/gmod-cjk.conf %command%
    依赖：系统里有中文字体（推荐 Noto Sans CJK SC）

    注意：只在 GMod 的启动项里使用，不要设成全局环境变量；
          也不要把它命名为 fonts.conf，以免和用户自己的配置混淆。
  -->

  <!-- 先加载系统配置，保留系统字体目录和用户已有的 fontconfig 规则
       （NixOS、Flatpak 等非标准字体路径也能被扫描到）。
       下面的 match 规则在它之后，会覆盖游戏请求的字体族。 -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- 宿主机和 Steam Linux Runtime 容器里的字体目录 -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/run/host/fonts</dir>
  <dir>/run/host/local-fonts</dir>
  <dir>~/.local/share/fonts</dir>

  <!-- Source 引擎在 Linux 上会请求这些字体，但它们没有中文字形。
       下面每个 edit 里按顺序列出候选字体，fontconfig 会用第一个已安装的。 -->

  <match target="pattern">
    <test name="family" qual="any"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <!-- 有些 Source 方案（如 POSIX 下的 SourceScheme.res）会直接请求带样式的族名 -->
  <match target="pattern">
    <test name="family" qual="any"><string>Verdana Bold</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica Bold</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Roboto</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Trebuchet MS</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>Microsoft YaHei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>SimHei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans SC</string>
      <string>Source Han Sans SC</string>
      <string>WenQuanYi Micro Hei</string>
      <string>sans-serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans CJK SC</string>
